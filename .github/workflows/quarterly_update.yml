name: FINRA 606 Quarterly Update

on:
  schedule:
    # KST 09:00 = UTC 00:00 | 매년 Feb/May/Aug/Nov 5일
    - cron: '0 0 5 2,5,8,11 *'
  workflow_dispatch:  # GitHub UI에서 수동 실행 가능

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run FINRA 606 analysis
        run: python finra606_analyze.py --auto

      - name: Commit new CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "data: quarterly FINRA 606 update $(date +'%Y-%m-%d')"
          git push
